<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel v2.0 — Convergent Binary Analysis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#060610;color:#c8c8d4;padding:20px}
.header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #1a1a3a;background:#0a0a18;margin-bottom:20px}
.header h1{font-size:24px;background:linear-gradient(135deg,#64dc8c,#64aadc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .badge{font-size:10px;background:#1a1a3a;padding:4px 8px;border-radius:4px;color:#888}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:#0e0e22;border:1px solid #1a1a3a;border-radius:10px;padding:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #111;font-size:13px}
.row:last-child{border:0}
.label{color:#777}.value{font-weight:600}
.green{color:#64dc8c}.blue{color:#64aadc}.yellow{color:#dcaa64}.red{color:#dc6464}
button{padding:8px 14px;border:1px solid #333;border-radius:6px;background:#1a1a3a;color:#c8c8d4;cursor:pointer;font-size:11px;margin:3px}
button:hover{background:#222}
button.primary{background:#64dc8c;color:#060610;border-color:#64dc8c}
input,textarea{padding:8px;border:1px solid #333;border-radius:4px;background:#0a0a1a;color:#c8c8d4;width:100%;margin:6px 0;font-family:monospace}
.code{background:#0a0a1a;padding:10px;border-radius:4px;font-family:monospace;font-size:11px;max-height:200px;overflow-y:auto;white-space:pre-wrap}
.expert-card{display:flex;align-items:center;padding:8px;margin:4px 0;background:#0a0a1a;border-radius:4px}
.expert-dot{width:8px;height:8px;border-radius:50%;margin-right:8px}
.hot{background:#64dc8c;box-shadow:0 0 6px #64dc8c66}
.cold{background:#64aadc}
.verdict{padding:8px;border-radius:4px;font-weight:bold;text-align:center;margin-top:8px}
.benign{background:#1a3a1a;color:#64dc8c}
.low{background:#3a3a1a;color:#dcaa64}
.moderate{background:#3a1a1a;color:#dc6464}
.high{background:#3a0000;color:#ff0000}
</style>
</head>
<body>

<div class="header">
    <h1>Kestrel v2.0</h1>
    <span class="badge">Convergent Binary Analysis</span>
    <span style="margin-left:auto;font-size:12px" id="status">Connecting...</span>
</div>

<div class="grid">
    <div class="card">
        <h2>Binary Analysis</h2>
        <input type="text" id="binaryPath" placeholder="/bin/ls" value="/bin/ls">
        <button class="primary" onclick="analyzeBinary()">Analyze Binary</button>
        
        <div id="analysisResult" style="margin-top:10px"></div>
    </div>
    
    <div class="card">
        <h2>System Status</h2>
        <div id="systemStats">
            <div class="row"><span class="label">Engine</span><span class="value green">Kestrel v2.0</span></div>
            <div class="row"><span class="label">Experts</span><span class="value" id="expertCount">-</span></div>
            <div class="row"><span class="label">Memory</span><span class="value" id="memoryUsage">-</span></div>
            <div class="row"><span class="label">Status</span><span class="value green" id="engineStatus">-</span></div>
        </div>
    </div>
    
    <div class="card">
        <h2>Expert Configuration</h2>
        <div id="expertList"></div>
    </div>
</div>

<div class="card" style="margin-top:14px">
    <h2>Analysis History</h2>
    <div id="history"></div>
</div>

<script>
const API = "http://127.0.0.1:9394";

// Check health
async function checkHealth() {
    try {
        const response = await fetch(API + "/health");
        const data = await response.json();
        
        if (data.status === "healthy") {
            document.getElementById("status").innerHTML = "● Connected";
            document.getElementById("status").className = "green";
            document.getElementById("engineStatus").textContent = "Running";
            document.getElementById("expertCount").textContent = data.experts;
            document.getElementById("memoryUsage").textContent = data.memory_mb.toFixed(2) + " MB";
        }
    } catch (e) {
        document.getElementById("status").innerHTML = "● Disconnected";
        document.getElementById("status").className = "red";
        document.getElementById("engineStatus").textContent = "Offline";
    }
}

// Analyze binary
async function analyzeBinary() {
    const path = document.getElementById("binaryPath").value;
    
    if (!path) {
        alert("Please enter a binary path");
        return;
    }
    
    document.getElementById("analysisResult").innerHTML = "Analyzing...";
    
    try {
        const response = await fetch(API + "/analyze?path=" + encodeURIComponent(path));
        const data = await response.json();
        
        if (data.success && data.analysis) {
            displayAnalysis(data.analysis);
        } else {
            document.getElementById("analysisResult").innerHTML = 
                '<div class="red">Error: ' + (data.error || "Analysis failed") + '</div>';
        }
    } catch (e) {
        document.getElementById("analysisResult").innerHTML = 
            '<div class="red">Error: ' + e.message + '</div>';
    }
}

// Display analysis results
function displayAnalysis(analysis) {
    let html = '<div class="code">';
    html += '<strong>File:</strong> ' + analysis.path + '<br>';
    html += '<strong>Size:</strong> ' + analysis.size + ' bytes<br>';
    html += '<strong>Risk Score:</strong> ' + analysis.convergence.risk_score.toFixed(3) + '<br>';
    html += '<strong>Verdict:</strong> ' + analysis.convergence.verdict + '<br><br>';
    
    html += '<strong>Layer Analysis:</strong><br>';
    for (const [layer, result] of Object.entries(analysis.layers)) {
        if (result) {
            html += '  ✓ ' + layer + ': ' + result.confidence.toFixed(3) + '<br>';
        }
    }
    
    html += '</div>';
    
    // Verdict styling
    const verdictClass = analysis.convergence.verdict.toLowerCase().replace(' ', '-');
    html += '<div class="verdict ' + verdictClass + '">' + 
            analysis.convergence.verdict + '</div>';
    
    document.getElementById("analysisResult").innerHTML = html;
}

// Load experts
async function loadExperts() {
    try {
        const response = await fetch(API + "/experts");
        const data = await response.json();
        
        if (data.success) {
            let html = '';
            for (const expert of data.experts) {
                html += '<div class="expert-card">';
                html += '<div class="expert-dot ' + (expert.hot ? 'hot' : 'cold') + '"></div>';
                html += '<span>' + expert.name + '</span>';
                html += '<span style="margin-left:auto;font-size:10px">' + 
                        expert.input_dim + '→' + expert.output_dim + '</span>';
                html += '</div>';
            }
            document.getElementById("expertList").innerHTML = html;
        }
    } catch (e) {
        console.error("Failed to load experts:", e);
    }
}

// Initialize
checkHealth();
loadExperts();
setInterval(checkHealth, 5000);  // Refresh every 5 seconds
</script>
</body>
</html>
